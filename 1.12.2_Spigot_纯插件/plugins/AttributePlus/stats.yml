    introduction:
      type: ENCHANTED_BOOK
      slot: 22
      name: "&6服务器属性介绍"
      lore:
        - " "
        - "&f&l斗天真伤: &7无需触发几率，造成&f&l斗天真伤伤害&r&7，拥有&f&l斗天觉醒&r&7后可造成(1 + &f&l&o&n斗天觉醒&r&7)倍的&f&l斗天真伤§c§l暴击伤害&r&7 ，无冷却时间"
        - " "
        - "&9&l雷霆: &7触发后，召唤天雷攻击目标，造成(&l&c&n1.2&r&7 + &9&l&o&n雷霆觉醒&r&7)倍&9&l雷霆伤害&r&7或(&l&c&n1.05&r&7 + &9&l&o&n雷霆觉醒&r&7)倍&9&l雷霆§c§l暴击伤害&r&7"
        - "       &7并对玩家周围(2 + &9&l&o&n雷霆范围&r&7)格内的所有非玩家的其他实体造成&l&c&n10&r&7%的本次造成的&9&l雷霆伤害&r&7作为溅射伤害，冷却时间&l&c&n6&r&7s"
        - " "
        - "&5&l毒素: &7触发后，令目标每&l&c&n0.25&r&7s受到一次&5&l毒素伤害&r&7(享受暴击效果)，共造成(&l&c&n2&r&7 + &5&l&o&n毒素觉醒&r&7)次毒素伤害，冷却时间&l&c&n2&r&7s" 
        - " "
        - "&e&l神圣: &7触发后，对目标造成&e&l神圣伤害&r&7(享受暴击效果)，削弱对方当前(&l&c&n10&r&7% + &e&l&o&n神圣觉醒&r&7)的各种防御&l&c&n10&r&7s，冷却时间&l&c&n15&r&7s" 
        - " "
        - "&c&l处决: &7触发后，对目标造成&c&l处决伤害&r&7(享受暴击效果)，追加造成对方当前(&l&c&n5&r&7% + &c&l&o&n处决觉醒&r&7)血量的&c&l处决伤害&r&7，冷却时间&l&c&n6&r&7s" 
        - " "
        - "&4&l斩杀: &7触发后，当目标(非玩家)当前血量低于其最大生命值的&4&l&o&n斩杀百分比&r&7时，造成对方当前剩余生命值的伤害，无冷却时间" 
        - " "
        - "&8&l破甲: &7触发后，削弱对方当前&8&l&o&n破甲效果&r&7的各种防御(以增加攻击替代削弱防御)，下次攻击结束后或&l&c&n2&r&7s后恢复，无冷却时间" 
        - " "
        - "&d&l元素暴击: &7除&f&l斗天真伤&r&7外，其他元素均可触发&d&l元素暴击&r&7，且&l&c&n优先级&r&7高于普通暴击" 
        - " "
        - "&6&l储存: &7触发后，记录并累计本次造成的&l&c&n所有伤害&r&7，累计触发&l&c&n5&r&7次后，造成一次(&6&l&o&n储存伤害倍率&r&7 * 累计伤害)的&6&l储存伤害&r&7" 
        - "       &7造成&6&l储存伤害&r&7后或&l&c&n5&r&7s内未累计储存计数后重置，无冷却时间"
        - " "
        - "&6&l阶段防御: &7无需触发几率，若对方的&6&l阶段攻击&r&7&l&c < &r&7己方的&6&l阶段防御&r&7，则对方对己方造成的&l&c&n所有伤害&r&7削减&l&c&n99&r&7%，无冷却时间" 
        # - " "
        # - "&6&l撕裂: &7触发后，对目标造成对方当前&l&c&n5&r&7%的血量的&6&l撕裂伤害&r&7，并受到&6&l&o韧性&r&7的影响，无冷却时间"  
        # - " "
        # - "&6&l韧性: &7最高生效&c&n100&r&7点，每&l&c&n1&r&7点&6&l韧性&r&7给予&l&c&n0.1&r&7点&8&l&o伤害减免&r&7以及&l&c&n0.8&r&7%的&6&l&o撕裂伤害&r&7减免"  
