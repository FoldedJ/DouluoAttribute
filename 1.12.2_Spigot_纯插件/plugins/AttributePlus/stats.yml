    introduction:
      type: ENCHANTED_BOOK
      slot: 22
      name: "&6服务器属性介绍"
      lore:
        - " "
        - "&f&l斗天真伤: &7无视目标&6&l&n物理防御&r&7造成&f&l斗天真伤伤害&r&7（不享受暴击效果），无冷却时间"
        - " "
        - "&9&l雷霆: &7触发后，召唤一条天雷攻击目标，造成&9&l雷霆伤害&r&7（享受暴击效果），冷却时间&l&c&n5&r&7s"
        - " "
        - "&2&l毒素: &7触发后，令目标每&l&c&n0.5&r&7s受到一次&2&l毒素伤害&r&7（享受暴击效果），共造成（&l&c&n2&r&7 + &2&l&o毒素觉醒&r&7）次毒素伤害，冷却时间&l&c&n2&r&7s" 
        - " "
        - "&2&l毒素觉醒: &7增加&2&l毒素伤害&r&7的次数" 
        - " "
        - "&e&l神圣: &7触发后，对目标造成&e&l神圣伤害&r&7（享受暴击效果），削弱对方当前&l&c&n10&r&7%的各种防御&l&c&n10&r&7s，无冷却时间" 
        - " "
        - "&4&l处决: &7触发后，对目标造成&4&l处决伤害&r&7（享受暴击效果），追加造成对方当前&l&c&n10&r&7%的血量的&4&l处决伤害&r&7，冷却时间&l&c&n5&r&7s" 
        - " "
        - "&c&l斩杀: &7当目标（非玩家）当前血量低于其最大生命值的&c&l&o斩杀百分比&r&7时，造成对方当前剩余生命值的伤害，无冷却时间" 
        - " "
        - "&c&l斩杀百分比: &7增加&c&l斩杀&r&7中触发血量的百分比"  
        - " "
        - "&8&l破甲: &7触发后，削弱对方当前&8&l&o破甲效果&r&7的各种防御&l&c&n10&r&7s，下次攻击后恢复，无冷却时间" 
        - " "
        - "&8&l破甲效果: &7增加&8&l破甲&r&7中削弱目标各种防御的百分比"  
        - " "
        - "&6&l撕裂: &7触发后，对目标造成对方当前&l&c&n5&r&7%的血量的&6&l撕裂伤害&r&7，并受到&f&l&o韧性&r&7的影响，无冷却时间"  
        - " "
        - "&f&l韧性: &7最高生效&c&n100&r&7点，每&l&c&n1&r&7点&f&l韧性&r&7给予&l&c&n0.1&r&7点&8&l&o伤害减免&r&7以及&l&c&n0.8&r&7%的&6&l&o撕裂伤害&r&7减免"  






